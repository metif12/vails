# Docs - builds the docs site and publishes it to GitHub Pages.
#
# Separate from ci.yml for the two reasons PLAN.md section 7 gives, both of which
# are properties rather than preferences:
#
#   1. it is FAST. An SSG that writes a handful of pages costs seconds, and
#      paying for the whole V container image to do it wastes runner time;
#   2. its failure must not redden a green build. A dead link in the docs has no
#      reason to stop the desktop build, but inside one workflow it would, and a
#      required check would then hold every PR hostage.
#
# The `paths:` filter is what keeps that promise: a docs run happens when docs
# change, which is also why `CONTEXT.md`, `docs/ADR/**` and `v.mod` are listed -
# those are the files the site's content is generated FROM.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'CONTEXT.md'
      - 'docs/ADR/**'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'v.mod'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'CONTEXT.md'
      - 'docs/ADR/**'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'v.mod'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # required for artifact deployment

concurrency:
  group: pages
  # Two concurrent deployments of one branch is meaningless: the second would win
  # and the first's logs would describe a state that no longer exists.
  cancel-in-progress: true

jobs:
  build:
    # No container. The site is pure-V veb - it compiles no C - so a V with a
    # vlib is enough, and the GTK/WebKit stack that ci.yml needs is irrelevant
    # here. Deliberately not folded into the linux job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Why this action, this tag, and this version string - three separate
      # decisions, each of which cost a red run:
      #
      #   **`vlang/setup-v`, not `oven-sh/setup-v`.** That repository no longer
      #   exists; the job failed at step 1 with `Unable to resolve action
      #   oven-sh/setup-v, repository not found`. A dependency this repository can
      #   neither fix nor see, which is the argument the Dockerfile makes for
      #   pinning V itself.
      #
      #   **`v1.7`, not a floating `v1`.** The two are different commits in
      #   setup-v (`2c790c6` vs `663cc08`) and `v1` was last released in 2022,
      #   so floating on it would let an unmaintained action quietly become the
      #   toolchain.
      #
      #   **`0.5.2`, with no `v` prefix.** This is the load-bearing one and it is
      #   not cosmetic. `downloadPrebuilt` resolves the tag with
      #   `getReleaseByTag({ tag })`, and V's release tags are bare - `0.5.2`,
      #   not `v0.5.2`. Passing `v0.5.2` makes the lookup fail, the action falls
      #   back to building V **from source**, and that build fails with a parser
      #   error in `vlib/math/bits/bits.v:621` - because the bootstrap compiler it
      #   downloads is newer than 0.5.2 and master has since started rejecting
      #   the parenthesised-`if` syntax 0.5.2's vlib uses. So a wrong prefix does
      #   not fail loudly: it silently switches to a build path that cannot work.
      #   Measured on the run that produced this comment.
      #
      # The version is pinned, and bumping it means a real choice: `0.5.2` is the
      # latest release AND the last V without a release that this repo's json2
      # constraint excludes. Re-run the export step after any bump, for the same
      # reason the Dockerfile's V pin says so.
      - uses: vlang/setup-v@v1.7
        with:
          version: 0.5.2
      - name: Export the site
        # `-prod` is the whole point of this step and the reason it is spelled out
        # in PLAN.md section 7 decision 1: with it, veb's templates are compiled
        # into the binary, so a template error breaks CI rather than a visitor.
        # Do not "simplify" this to `v run` for speed.
        run: v -prod run docs/site -- --export
      - name: Fail if the export produced nothing
        # An exporter that "succeeds" with an empty dist/ is the exact failure this
        # site had twice (once a 404 body as the home page, once a dist/ beside the
        # Dockerfile). Buildplan already asserts the path mapping; this asserts the
        # artifact is actually there.
        run: |
          test -f docs/site/dist/index.html || { echo "::error::no index.html in the export"; exit 1; }
          test -f docs/site/dist/404.html || { echo "::error::no 404.html in the export"; exit 1; }
          echo "exported $(find docs/site/dist -name '*.html' | wc -l) HTML file(s)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    # Only on a push to main. A pull request builds and uploads, which proves the
    # step works, but publishing from a branch would make the published site lag
    # behind a PR that closes without merging.
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
