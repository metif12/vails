# CI — the first one in this repository (ADR-0022 B3).
#
# Shape: one job per target on a matrix. Linux builds inside the
# repository's own Dockerfile; Windows builds on a native runner with
# MSYS2. Both facts are decisions and both are argued in ADR-0022:
#
# - **No single Dockerfile for both platforms.** The Windows backend
#   links the *Windows* import library of `webview` (C++, against
#   WebView2); cross-compiling it is its own project.
# - **No Windows container.** It costs more, runs slower, and is no more
#   reproducible than a pinned `pacman -S` step on a normal runner.
#
# What each push does: `v test .`, a smoke build of the CLI, a build of
# `examples/services`, and — on Windows — a `vails build` whose output is
# checked to actually start. What a tag does additionally: stamp a
# version and upload the artifact. The release job exists because the
# updater's GitHub provider consumes exactly these assets (ADR-0020 U6),
# so the publisher is the build's own last step rather than a separate
# manual chore — which is why the two tracks were planned together.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # ADR-0005: apps MUST build with `-gc none` on Linux. Boehm GC crashes
  # (`GC_noop1_ptr`, fork-unsafe) when WebKit spawns subprocesses. Real
  # builds get this from `buildplan.app_flags(.linux)`, so this variable
  # is only what `v test` and the ad-hoc `v` invocations below need.
  VFLAGS: -gc none

jobs:
  linux:
    name: linux (container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # The image compiles V once as its own layer, so this is the
        # slow step and it is cached on the image layer, not per run.
        run: docker build -t vails-ci -f Dockerfile .

      - name: v test .
        # Inside the container: no MSYS2, no Windows path assumptions,
        # the same `v test .` a developer runs.
        run: docker run --rm vails-ci

      - name: build the CLI
        # The CLI imports `net` (the dev server), which is why it has its
        # own recipe in `buildplan.cli_flags` and why this is a separate
        # step from the app build: they are not the same command.
        run: |
          docker run --rm -v "$PWD:/work" -w /work vails-ci \
            sh -c '/opt/vlang/v -cc gcc -cflags "-Wno-incompatible-pointer-types" -o /work/vails ./cli'

      - name: build an app
        # An app needs no flags beyond -gc none (asserted in
        # `buildplan.app_flags` and at tests/e2e_windows/README.md:41).
        run: |
          docker run --rm -v "$PWD:/work" -w /work vails-ci \
            sh -c '/opt/vlang/v -cc gcc -o /work/services ./examples/services'

  windows:
    name: windows (msys2 ucrt64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 ucrt64 + the webview packages
        # MOVED TO THE TOP, and that move is the whole fix for this job's
        # long-standing red state.
        #
        # It used to sit after `Install V`, because V was installed as the
        # 0.5.2 release zip and that zip needs no C compiler to unpack. But
        # 0.5.2 has no `json2` in its vlib - `json2` was added to vlang/v on
        # 2026-10-03, which is after every published tag - so `bridge/` and
        # `state/` could not compile, and the smoke step below failed with
        # `no vlib\json2`. AGENTS.md 1b named the only fix that works: build V
        # from source at a pinned commit, with MSYS2 installed BEFORE it
        # because V's own Windows build needs a C compiler.
        #
        # So the order is now the one that constraint forces: toolchain first,
        # compiler second. The same pinned commit the Dockerfile builds, so
        # the two CI platforms compile against the same V rather than against
        # two different ones that happen to agree.
        run: |
          choco install msys2 -y --no-progress
          C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-webview mingw-w64-ucrt-x86_64-webview2-loader"

      - name: Put ucrt64 on PATH
        # Before the V build, not just before the tests. ADR-0005's rule is
        # about EVERY later step: without `C:\msys64\ucrt64\bin` on PATH even
        # `cc1` cannot find its own DLLs, which fails as a SILENT gcc failure
        # rather than a missing-symbol error - and a V built by a cc1 that
        # could not load is a V that fails later for a reason nobody can see.
        # GITHUB_PATH only affects subsequent steps, which is exactly the
        # scope wanted.
        #
        # SINGLE quotes, and they are load-bearing. A YAML double-quoted scalar
        # processes backslash escapes, and `\m` is not one - so the double-quoted
        # form of this line was not valid YAML at all. GitHub rejects the whole
        # file, reports "This run likely failed because of a workflow file issue",
        # and runs zero jobs in 0s. That is the second, distinct cause of the same
        # symptom `buildplan/workflow_test.v` was written for: it caught the
        # indentation break, and it cannot catch this, because a line-prefix check
        # cannot see inside a scalar.
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build V from source at the pinned commit
        # THE PIN, and why it is a commit rather than a tag.
        #
        # A tag cannot work: no published release contains `json2`. vlang/v
        # added it on 2026-10-3, every release predates that, and
        # `bridge/` + `state/` import it - so `v test .` fails with
        # `builder error: cannot import module "json2" (not found)`. Measured
        # against the API's own answer rather than assumed: `gh api
        # repos/vlang/v/contents/vlib/json2?ref=7647ce1` returns 404, while
        # the same query at the pinned commit returns the module.
        #
        # The commit is the SAME one the Dockerfile builds, so the Linux and
        # Windows jobs compile this repository against one compiler rather
        # than two. Bump it in both places together.
        #
        # `makev.bat -gcc` is V's own Windows build command - it is the first
        # thing `vlang/v`'s `windows_ci_gcc.yml` runs after checkout, so this
        # is the recipe V itself validates on a runner rather than one invented
        # here. The fetch-by-SHA form is used because a shallow clone's HEAD is
        # not the pinned commit, and GitHub serves any reachable commit that
        # way.
        #
        # `v symlink` is V's own next step and is kept: `v` resolves its own
        # vlib relative to the executable, and this is the binary that step
        # leaves on PATH.
        run: |
          $sha = '60542b9904a3a0102575ec1104e548996f650a83'
          $src = Join-Path $env:RUNNER_TEMP 'vsrc'
          if (Test-Path $src) { Remove-Item $src -Recurse -Force }
          git init -q $src
          git -C $src remote add origin https://github.com/vlang/v.git
          git -C $src fetch --depth 1 origin $sha
          if ($LASTEXITCODE -ne 0) { throw "could not fetch V at $sha" }
          git -C $src checkout -q FETCH_HEAD
          Push-Location $src
          .\makev.bat -gcc
          if ($LASTEXITCODE -ne 0) { throw "makev.bat failed with exit code $LASTEXITCODE" }
          .\v.exe version
          .\v.exe symlink
          if ($LASTEXITCODE -ne 0) { throw "v symlink failed with exit code $LASTEXITCODE" }
          Pop-Location
          "$src" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: This compiler can build this repo
        # A smoke step, and it exists because of a measured failure mode rather
        # than a hypothetical one: `bridge/` and `state/` import `json2`, and a V
        # install whose vlib has no `json2` fails with
        #   builder error: cannot import module "json2" (not found)
        # which reads like a missing dependency in this repo and is not one.
        #
        # This step is what turned that into a readable failure while the job
        # was pinned to 0.5.2, and it is kept now that the job builds from
        # source - a green line here is the cheapest possible proof that the
        # pinned commit is the one the job thinks it is.
        #
        # ONE Split-Path, not two, and the reason is the layout: v.exe sits in
        # the same directory as vlib/ (the step above puts the source root on
        # PATH), so one level up from v.exe IS the vroot. The previous two-level
        # form was only correct for a layout where v.exe lives in a bin/ beside
        # vlib/, and it happened to pass on the machine this was written on
        # purely because that machine's `v` is a .bin\v.bat forwarder - which is
        # exactly the kind of coincidence that stops being true on a fresh
        # runner.
        run: |
          v version
          $vroot = Split-Path (Get-Command v).Source
          if (-not (Test-Path (Join-Path $vroot 'vlib\json2'))) {
            Write-Error "no vlib\json2 under $vroot - bridge/ and state/ import json2, so this V cannot build this repo. The pinned commit should have it (see AGENTS.md 1b)"
            exit 1
          }
          Write-Output "json2 present under $vroot"

      - name: v test .
        # The `-ldflags` is kept, and the reason it is kept is that it is
        # VERSION-SCOPED rather than needed here. On V 0.5.2 it was not
        # optional, because of a V bug rather than a repo one: 0.5.2's
        # `dependency_scan_fallback` link path emits `#flag`-sourced `-l` flags
        # BEFORE most object files, and GNU ld only resolves an archive against
        # the objects that precede it, so `net.http`'s `ws2_32` never resolves.
        # It has to arrive as `-ldflags`, which is emitted last.
        #
        # It is unnecessary on a newer V, measured 2026-10-03 across 33 test
        # files on V master - and this job now pins master, so the flag is not
        # doing any work. It stays because a command that works on both
        # compilers is worth more than one that is minimal on the compiler we
        # happen to pin this month: `buildplan.cli_flags` still emits it for
        # exactly that reason, and the test that asserts it is what documents
        # that it exists on purpose. Removing it means also removing the
        # assertion, which turns a version difference into a mystery again.
        run: v -cc gcc -ldflags "-lws2_32" test .

      - name: build the CLI
        # The `-cflags` on this step is the same story as the `-ldflags` above:
        # needed on 0.5.2, unnecessary on the master this job pins, kept so one
        # command serves both and `buildplan.cli_flags` stays truthful.
        run: v -cc gcc -cflags "-Wno-incompatible-pointer-types" -ldflags "-lws2_32" -o vails.exe ./cli

      - name: vails build produces a RUNNABLE binary
        # This step is the reason B1 exists. The five side-by-side DLLs
        # used to be `#` comments in a README and nothing else, so a
        # green CI would have uploaded an .exe that cannot start — a
        # worse outcome than no CI at all. The check is that the staging
        # step reported all five AND that they are in the artifact dir.
        run: |
          $env:VAILS_HOME = $PWD
          New-Item -ItemType Directory -Force -Path ci-smoke | Out-Null
          Push-Location ci-smoke
          ..\vails.exe init smokeapp
          Pop-Location
          Push-Location ci-smoke\smokeapp
          ..\..\vails.exe build --version 0.0.0-ci
          $staged = @('libwebview-0.12.dll', 'WebView2Loader.dll', 'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')
          foreach ($d in $staged) {
            if (-not (Test-Path $d)) { throw "not staged: $d - a green build that cannot start" }
          }
          Pop-Location

      - name: upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: vails-windows
          path: ci-smoke/smokeapp/

  release:
    name: release on a tag
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the tag version
        # Stripped of the leading `v`, which every tag in this
        # repository's history carries. `buildinfo.validate_version` in
        # the app itself accepts and strips it too, so the two agree.
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> $env:GITHUB_OUTPUT

      - name: Check the tag and v.mod agree
        # A tag saying 0.5.0 while vails.json says 0.4.0 is the exact
        # drift B0 reconciled, arriving again through a different door.
        # `buildinfo.version_drift` is the same rule the test enforces.
        run: |
          echo "tag version: ${{ steps.ver.outputs.version }}"
          grep "version" v.mod

      - name: Build the version-stamped app
        # The stamp is `-d vails_version=`, which `buildplan.recipe`
        # emits and `buildinfo.version` reads back (ADR-0022 B0). A
        # release without it reports 'dev' forever, and 'dev' silently
        # disables every update check — so this step is not cosmetic.
        run: |
          docker build -t vails-ci -f Dockerfile .
          docker run --rm -v "$PWD:/work" -w /work vails-ci \
            sh -c "/opt/vlang/v -cc gcc -d vails_version=${{ steps.ver.outputs.version }} -o /work/services ./examples/services"

      - name: Attach the updater manifest
        # ADR-0020 U6: the publisher and the client read the same manifest
        # code, so the format has exactly one writer. `vails updater
        # manifest` IS that writer and it arrives with U6; until then this
        # step records the version so a later run has the value, rather
        # than pretending the manifest exists.
        run: echo "vails updater manifest not implemented yet (ADR-0020 U6) - version ${{ steps.ver.outputs.version }}"
