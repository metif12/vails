<!doctype html>
<!-- Source of truth for the hello UI: main.v loads this file at runtime. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Default Vails CSP (mirrors webview.default_csp() — kept in sync by webview/secure_test.v).
     Preview fallback (opened outside a Vails window) runs under the same policy: the secure mode. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" />
<title>Hello Vails</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #1e293b;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 36px 32px;
    width: min(420px, 92vw);
    text-align: center;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
  }
  .badge {
    width: 56px;
    height: 56px;
    margin: 0 auto 12px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .subtitle { margin: 0 0 20px; color: #64748b; font-size: 14px; }
  .counter-value {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    margin: 8px 0 16px;
    font-variant-numeric: tabular-nums;
    transition: transform 0.12s ease;
  }
  .counter-value.pop { transform: scale(1.12); }
  .btn-row { display: flex; gap: 12px; justify-content: center; }
  button { cursor: pointer; font: inherit; border: none; border-radius: 12px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .btn-count {
    flex: 1;
    padding: 12px 0;
    font-size: 24px;
    font-weight: 700;
  }
  .btn-dec { background: #f1f5f9; color: #0f172a; }
  .btn-dec:hover { background: #e2e8f0; }
  .btn-inc { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .btn-inc:hover { filter: brightness(1.08); }
  .btn-reset {
    margin-top: 12px;
    background: none;
    color: #64748b;
    font-size: 13px;
    text-decoration: underline;
  }
  .btn-reset:hover { color: #0f172a; }
  .divider { border: none; border-top: 1px solid #e2e8f0; margin: 24px 0 20px; }
  .btn-ping {
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    background: #0f172a;
    color: #fff;
  }
  .btn-ping:hover { background: #1e293b; }
  .status {
    margin: 14px 0 0;
    font-size: 13px;
    font-family: ui-monospace, Consolas, monospace;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 8px 12px;
    color: #475569;
    min-height: 36px;
  }
  .hint { margin: 14px 0 0; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<main class="card">
  <div class="badge">V</div>
  <h1>Hello from Vails</h1>
  <p class="subtitle">V backend counter + bridge demo</p>
  <div class="counter-value" id="count">0</div>
  <div class="btn-row">
    <button class="btn-count btn-dec" id="dec" type="button">-</button>
    <button class="btn-count btn-inc" id="inc" type="button">+</button>
  </div>
  <button class="btn-reset" id="reset" type="button">Reset</button>
  <hr class="divider" />
  <button class="btn-ping" id="ping" type="button">ping backend</button>
  <p class="status" id="status">backend: not connected</p>
  <p class="hint" id="hint"></p>
</main>
<script>
(function () {
  var countEl = document.getElementById("count");
  var statusEl = document.getElementById("status");
  var hintEl = document.getElementById("hint");
  var incBtn = document.getElementById("inc");
  var decBtn = document.getElementById("dec");
  var resetBtn = document.getElementById("reset");
  var pingBtn = document.getElementById("ping");
  var useBackend = !!window.vails;
  var localCount = 0;

  function render(n) {
    countEl.textContent = n;
    countEl.classList.remove("pop");
    void countEl.offsetWidth;
    countEl.classList.add("pop");
  }
  function showError(e) {
    statusEl.textContent = "error: " + (e && e.message ? e.message : e);
  }
  function applyResult(r) {
    var n = parseInt(r, 10);
    if (isNaN(n)) {
      statusEl.textContent = "backend says: " + r;
      return;
    }
    render(n);
  }
  function callOrLocal(method) {
    if (useBackend) {
      return window.vails.call(method, "");
    }
    if (method === "counter_inc") { localCount += 1; }
    else if (method === "counter_dec") { localCount -= 1; }
    else if (method === "counter_reset") { localCount = 0; }
    else if (method === "counter_get") { /* no change */ }
    return Promise.resolve(String(localCount));
  }

  incBtn.addEventListener("click", function () {
    callOrLocal("counter_inc").then(applyResult).catch(showError);
  });
  decBtn.addEventListener("click", function () {
    callOrLocal("counter_dec").then(applyResult).catch(showError);
  });
  resetBtn.addEventListener("click", function () {
    callOrLocal("counter_reset").then(applyResult).catch(showError);
  });
  pingBtn.addEventListener("click", function () {
    if (!useBackend) {
      statusEl.textContent = "preview mode: run inside Vails window";
      return;
    }
    window.vails.call("ping", "").then(function (r) {
      statusEl.textContent = "backend says: " + r;
    }).catch(showError);
  });

  if (useBackend) {
    window.vails.onEvent("ready", function (d) {
      statusEl.textContent = "event: " + d;
    });
    callOrLocal("counter_get").then(applyResult).catch(showError);
  } else {
    render(0);
    pingBtn.disabled = true;
    hintEl.textContent = "preview mode: counter runs locally, run inside Vails window for backend state";
    statusEl.textContent = "preview mode: run inside Vails window";
  }
})();
</script>
</body>
</html>
